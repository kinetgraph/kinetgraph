# SPDX-FileCopyrightText: 2026 kinetgraph
# SPDX-License-Identifier: Apache-2.0

version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "Apache-2.0"

# Generated artefacts that don't carry a license
# header: coverage HTML, build metadata, lock files,
# pyright + radon baselines. Each generated JSON has
# a sidecar ``.json.license`` file (REUSE convention
# for files that don't support comments).
[[annotations]]
path = "htmlcov/**"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "src/kntgraph.egg-info/**"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/*.pyc"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "**/__pycache__/**"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ".venv/**"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ".venv/**/*"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "dist/**"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"

# Coverage JSON outputs from the ``reliability`` and
# ``verticals`` gates. ``coverage.py`` writes these at
# the repo root (e.g. ``.coverage``, ``.coverage-reliability.json``,
# ``.coverage-verticals.json``). The glob below covers every
# current and future coverage JSON; the matching entries
# are also listed in ``.gitignore`` so new files never enter
# the repo in the first place (belt + suspenders).
[[annotations]]
path = "**/.coverage*.json"
SPDX-FileCopyrightText = "2026 kinetgraph"
SPDX-License-Identifier = "CC0-1.0"
